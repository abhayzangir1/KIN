name: KIN Desktop Release Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Verify Native App (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libdbus-1-dev patchelf xdg-utils libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Clean Install npm dependencies
        run: npm ci

      - name: Gate 1 — TypeScript Typecheck
        run: npm run typecheck

      - name: Gate 2 — Build Core and UI Workspaces
        run: npm run build

      - name: Gate 3 — Package Standalone Sidecar Binary
        run: node core/scripts/package_binary.js

      - name: Gate 4 — Core Vitest Test Suite
        run: npm run test --workspace=core

      - name: Gate 5 — Tauri Cargo Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Gate 6 — Standalone Binary Boot & API Health Check
        shell: bash
        run: |
          echo "Resolving packaged binary path..."
          if [ -f "./src-tauri/binaries/kin-core.exe" ]; then
            BINARY_PATH="./src-tauri/binaries/kin-core.exe"
          elif [ -f "./src-tauri/binaries/kin-core" ]; then
            BINARY_PATH="./src-tauri/binaries/kin-core"
          elif [ -f "./core/binaries/kin-core.exe" ]; then
            BINARY_PATH="./core/binaries/kin-core.exe"
          elif [ -f "./core/binaries/kin-core" ]; then
            BINARY_PATH="./core/binaries/kin-core"
          else
            echo "ERROR: Standalone sidecar binary not found!"
            exit 1
          fi
          chmod +x "$BINARY_PATH" || true
          echo "Launching packaged daemon: $BINARY_PATH"
          $BINARY_PATH &
          DAEMON_PID=$!

          echo "Querying daemon health endpoint..."
          curl -sS --fail --retry 30 --retry-delay 1 --retry-connrefused --retry-max-time 60 http://127.0.0.1:54321/api/health

          echo "Stopping test daemon..."
          kill -9 $DAEMON_PID 2>/dev/null || taskkill //F //PID $DAEMON_PID 2>/dev/null || taskkill //F //IM kin-core.exe 2>/dev/null || true

      - name: Build Tauri Desktop Package & Publish Release Assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'KIN ${{ github.ref_name }}'
          releaseBody: |
            ## KIN — Local-First Autonomous AI Workforce Platform (${{ github.ref_name }})
            
            ### Verified Quality Gates:
            - **TypeScript Typecheck**: 0 diagnostic errors across `@kin/core` and `@kin/ui`.
            - **Test Suites**: All Vitest core unit tests and native Cargo supervisor tests passed.
            - **Single Executable Application (SEA)**: Node 22 native SQLite daemon embedded with zero external runtime dependencies.
            - **Process Supervision**: Native process lifecycle management with automatic cleanup guarantees.
            
            ### Downloads & Installers:
            - **Windows**: `KIN_${{ github.ref_name }}_x64-setup.exe` (NSIS) or `KIN_${{ github.ref_name }}_x64.msi` (WiX)
            - **macOS**: `KIN_${{ github.ref_name }}_universal.dmg`
            - **Linux**: `KIN_${{ github.ref_name }}_amd64.AppImage` or `kin_${{ github.ref_name }}_amd64.deb`
            
            *Cryptographic SHA-256 checksums are attached below in `SHA256SUMS.txt`.*
          releaseDraft: false
          prerelease: false

  generate-checksums:
    name: Generate & Attach SHA-256 Checksums
    runs-on: ubuntu-latest
    needs: [build-release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release-assets
          gh release download ${{ github.ref_name }} --dir release-assets

      - name: Compute SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          echo "### Release Asset SHA-256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat ../SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload SHA256SUMS.txt to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} SHA256SUMS.txt --clobber
